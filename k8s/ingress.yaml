apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-health-monitor
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/websocket-services: k8s-health-monitor
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
  - host: k8s-monitor.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: k8s-health-monitor
            port:
              number: 8000
